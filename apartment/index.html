<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apartment Model</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; }
      #app { width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 10px; left: 10px;
        color: #eee; font-family: system-ui, sans-serif; font-size: 13px;
        background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 6px;
        pointer-events: none; line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <b>Apartment Model — Step 1 test scene</b><br />
      Drag to orbit &middot; Scroll to zoom &middot; Right-drag to pan<br />
      Units: 1 grid square = 12 inches (1 foot)
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
