<style>
/* One look on purpose: a cozy night ride. Chocolate, cream and twinkle-light gold over a deep winter sky. */
:root {
  --night: #0b1030; --cocoa: #4a2412; --cocoa-2: #2a1208; --cream: #fff6e6; --gold: #ffc94a;
  --font: 'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--cream); font-family: var(--font);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#hud { position: fixed; z-index: 2; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; padding: 6px 20px 6px 10px; border-radius: 999px;
  background: rgba(42, 18, 8, .62); border: 3px solid rgba(255, 228, 184, .55); pointer-events: none;
  font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 var(--cocoa-2); }
#hud svg { width: 42px; height: 42px; display: block; }
#hud.pop { animation: pop .45s ease-out; }
@keyframes pop { 0% { transform: translateX(-50%) scale(1); } 40% { transform: translateX(-50%) scale(1.25); } 100% { transform: translateX(-50%) scale(1); } }

#mute { position: fixed; z-index: 3; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255, 228, 184, .4); background: rgba(42, 18, 8, .45);
  color: var(--cream); display: grid; place-items: center; padding: 0; opacity: .7; cursor: pointer; }
#mute svg { width: 22px; height: 22px; }
#mute:focus-visible, #play:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

#fade { position: fixed; z-index: 4; inset: 0; background: #04050e; opacity: 0; pointer-events: none; transition: opacity 1.4s ease; }
#fade.on { opacity: 1; }
#yay { position: fixed; z-index: 2; left: 0; right: 0; top: 26%; text-align: center; pointer-events: none;
  font-size: min(18vw, 120px); font-weight: 700; color: var(--gold); letter-spacing: .02em;
  text-shadow: 0 6px 0 #8a3b0e, 0 0 40px rgba(255, 190, 80, .8); opacity: 0; }
#yay.bad { color: #ff6a6a; text-shadow: 0 6px 0 #5a0a0a, 0 0 40px rgba(255, 80, 80, .7); font-size: min(14vw, 90px); }
#ouch { position: fixed; z-index: 2; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 50%, rgba(255, 0, 0, 0) 40%, rgba(220, 20, 20, .55)); }
#ouch.go { animation: ouch .5s ease-out; }
@keyframes ouch { 0% { opacity: 1; } 100% { opacity: 0; } }
#yay.go { animation: yay 1.6s cubic-bezier(.2, 1.6, .4, 1) forwards; }
@keyframes yay { 0% { opacity: 0; transform: scale(.2) rotate(-8deg); } 25% { opacity: 1; transform: scale(1.1) rotate(3deg); }
  45% { transform: scale(1) rotate(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05) translateY(-30px); } }

#hint svg { width: 100%; height: 100%; display: block; }
#hint { position: fixed; z-index: 2; left: 50%; bottom: calc(18% + env(safe-area-inset-bottom, 0px)); width: 92px; height: 92px; margin-left: -46px;
  pointer-events: none; animation: swipe 2.2s ease-in-out infinite; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
@keyframes swipe { 0%, 100% { transform: translateX(-28vw) rotate(-10deg); } 50% { transform: translateX(28vw) rotate(10deg); } }

#start { position: fixed; z-index: 5; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse at 50% 55%, rgba(11, 16, 48, .1), rgba(11, 16, 48, .7)); text-align: center; }
#start h1 { margin: 0; font-weight: 700; font-size: min(17vw, 120px); line-height: .95; color: var(--cream); text-wrap: balance;
  text-shadow: 0 5px 0 var(--cocoa), 0 9px 0 var(--cocoa-2), 0 0 50px rgba(255, 190, 90, .55); }
#start h1 span { color: var(--gold); }
#play { width: min(52vmin, 260px); height: min(52vmin, 260px); border-radius: 50%; border: 8px solid var(--cream); cursor: pointer;
  background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 45%, #e08a1e); box-shadow: 0 10px 0 #8a3b0e, 0 0 60px rgba(255, 200, 90, .7);
  display: grid; place-items: center; animation: breathe 1.4s ease-in-out infinite; padding: 0; }
#play svg { width: 46%; height: 46%; margin-left: 9%; }
@keyframes breathe { 50% { transform: scale(1.08); } }
#start p { margin: 0; max-width: 34ch; font-weight: 500; font-size: 15px; line-height: 1.4; color: rgba(255, 246, 230, .85); }
#choc { position: fixed; z-index: 4; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity .7s ease; }
#choc.out { opacity: 0; }
#done { position: fixed; z-index: 6; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; text-align: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#done h2 { margin: 0; font-weight: 700; font-size: min(16vw, 110px); line-height: 1; color: var(--cream); text-wrap: balance;
  text-shadow: 0 5px 0 var(--cocoa-2), 0 0 40px rgba(255, 200, 120, .45); animation: popin .6s cubic-bezier(.2, 1.6, .4, 1) both; }
#done .got { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: min(12vw, 64px); color: var(--gold); text-shadow: 0 4px 0 var(--cocoa-2);
  animation: popin .6s .15s cubic-bezier(.2, 1.6, .4, 1) both; font-variant-numeric: tabular-nums; }
#done .got svg { width: 1.1em; height: 1.1em; }
/* levels: hud, menu, intro, results */
.star { fill: var(--gold); stroke: #8a3b0e; stroke-width: 3; stroke-linejoin: round; }
.star.off { fill: rgba(255, 246, 230, .18); stroke: rgba(255, 246, 230, .35); }
#hud { gap: 14px; padding: 6px 16px; font-size: 30px; }
#hud .lvl { font-size: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 246, 230, .8); }
#hud .count { display: flex; align-items: center; gap: 6px; }
#hud .count svg { width: 30px; height: 30px; }
#hud small { font-size: 18px; color: rgba(255, 246, 230, .7); }
#hud .mini { display: flex; gap: 2px; }
#hud .mini svg { width: 22px; height: 22px; transition: transform .3s; }
#hud .mini svg:not(.off) { transform: scale(1.15); }
.panel { position: fixed; z-index: 6; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh; text-align: center; overflow-y: auto;
  padding: calc(20px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse at 50% 45%, rgba(30, 14, 6, .55), rgba(12, 6, 2, .85)); }
#done.panel { background: none; }
.panel h2 { margin: 0; font-weight: 700; font-size: min(12vw, 76px); line-height: 1; color: var(--cream); text-wrap: balance; text-shadow: 0 5px 0 var(--cocoa-2), 0 0 40px rgba(255, 200, 120, .4); }
.panel .sub { margin: 0; font-weight: 500; font-size: 17px; color: rgba(255, 246, 230, .85); max-width: 34ch; text-wrap: balance; }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; width: min(100%, 520px); }
.tier { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 6px; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 246, 230, .75); }
.tier svg { width: 16px; height: 16px; }
.lv { aspect-ratio: 1; border-radius: 22%; border: 3px solid rgba(255, 228, 184, .6); background: linear-gradient(#7a3e1c, #4a2412); color: var(--cream); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; font: 700 min(7vw, 30px)/1 var(--font); box-shadow: 0 4px 0 #2a1208; }
.lv .s { display: flex; gap: 1px; } .lv .s svg { width: min(4vw, 16px); height: min(4vw, 16px); }
.lv:disabled { opacity: .4; cursor: default; }
.lv:disabled svg.lock { width: 45%; height: 45%; fill: none; stroke: var(--cream); stroke-width: 3; }
.lv:focus-visible, .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.topbar { width: min(100%, 520px); display: flex; justify-content: flex-start; gap: 8px; flex-wrap: wrap; }
.pill { border-radius: 999px; border: 2px solid rgba(255, 228, 184, .5); background: rgba(42, 18, 8, .55); color: var(--cream); font: 700 14px/1 var(--font); padding: 9px 14px; cursor: pointer; }
.pill.warn { background: #b3261e; border-color: #ffb4a8; }
.pill:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.world2 { width: min(100%, 520px); border-radius: 18px; border: 2px dashed rgba(255, 228, 184, .45); padding: 12px 16px; font-size: 15px; color: rgba(255, 246, 230, .85); }
.world2 b { color: var(--gold); }
.goals { display: grid; gap: 10px; width: min(100%, 340px); }
.goal { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; border-radius: 16px; background: rgba(255, 246, 230, .1); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.goal .s { display: flex; gap: 3px; } .goal svg { width: 30px; height: 30px; }
.goal.top { background: rgba(255, 201, 74, .22); border: 2px solid var(--gold); font-size: 34px; }
.goal.need { outline: 2px solid rgba(255, 246, 230, .5); }
.bigstars { display: flex; gap: 10px; align-items: flex-end; }
.bigstars svg { width: min(22vw, 110px); height: min(22vw, 110px); animation: popin .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.bigstars svg:nth-child(2) { width: min(28vw, 140px); height: min(28vw, 140px); animation-delay: .25s; }
.bigstars svg:nth-child(3) { animation-delay: .5s; }
.row { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
.btn { width: 84px; height: 84px; border-radius: 50%; border: 5px solid var(--cream); cursor: pointer; padding: 0; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff1d6, #e8d2b0); box-shadow: 0 6px 0 #6a3a1a; }
.btn svg { width: 52%; height: 52%; }
.btn.go { width: 130px; height: 130px; background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 45%, #e08a1e); box-shadow: 0 8px 0 #8a3b0e, 0 0 40px rgba(255, 200, 90, .5); animation: breathe 1.4s ease-in-out infinite; }
@keyframes popin { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { #play, #hint, .btn.go { animation: none; } }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------------------------------------------------------------- constants
const W = 3.6;          // half width of the chocolate channel
const HC = 1.3;         // height of the channel walls (low, so the town shows over them)
const CPOW = 2.4;       // how round the U is
const K = 0.2;          // ground drops K units for every unit forward (world y = K * z)
const BASE = 2.2;       // channel bottom sits this far above the snow
const CH = 30;          // samples per chunk (1 sample = 1 unit)
const AHEAD = 6;        // chunks built in front
let SPEED = 12.5;
const MAXX = W * 0.74;
const EYE = 2.5;
let RIDE_CHUNKS = 6, END = RIDE_CHUNKS * CH;      // set per level: longer rides later on

const hProf = x => HC * Math.pow(Math.min(1, Math.abs(x) / W), CPOW);
const yawAt = s => 0.42 * Math.sin(s / 61) + 0.30 * Math.sin(s / 37 + 1.3) + 0.16 * Math.sin(s / 23 + 4.1);
const bumpAt = s => 0.9 * (0.5 + 0.5 * Math.sin(s / 27)) + 0.4 * (0.5 + 0.5 * Math.sin(s / 11 + 2));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let rideOff = 0;

// ---------------------------------------------------------------- levels: World 1, Cocoa Village
const LEVELS = 15;
const needStars = L => L <= 5 ? 1 : L <= 10 ? 2 : 3;        // stars needed on level L to open the next one
function levelCfg(L) {
  const d = (L - 1) / (LEVELS - 1);
  return { L, d, chunks: 6 + Math.floor((L - 1) / 2), speed: 12 + (L - 1) * 0.72, magnet: Math.max(0, 1.2 - (L - 1) * 0.3),
    seed: 1000 + L * 7919, hazards: L >= 3, ratios: [0.4 + d * 0.05, 0.6 + d * 0.08, 0.82 + d * 0.08] };
}
// a fixed layout of treats for each level, so it can be learned; harder patterns as levels go up
function planItems(cfg) {
  const r = rng(cfg.seed * 3 + 11), lanes = [-W * 0.5, 0, W * 0.5], types = ['star', 'ginger', 'present', 'cane'];
  const out = []; let maxGet = 0;
  const pick = (a, b) => a + Math.floor(r() * (b - a + 1));
  const gap = 2.4 + cfg.speed * 0.04;              // spacing inside a tidy row
  const reach = cfg.speed * 0.42;                  // distance covered in the time it takes to swing across the slide
  const edge = W * (0.55 + 0.15 * cfg.d);          // how far toward the walls treats may sit
  const busy = [];                                 // where treats are, so snow blocks never sit on top of one
  const add = (s, x, type) => { out.push({ s, x, type }); busy.push([s, x]); };
  for (let c = 1; c < cfg.chunks - 1; c++) {
    let sCur = c * CH + 2 + r() * 2;
    const cEnd = (c + 1) * CH;
    while (sCur < cEnd - 4) {
      const type = types[pick(0, 3)];
      // pattern weights: lane, weave, switch, split, scatter
      const w = [0.5 - 0.4 * cfg.d, 0.25, 0.1 + 0.1 * cfg.d, 0.05 + 0.2 * cfg.d, 0.1 + 0.45 * cfg.d];
      let roll = r() * w.reduce((a, b) => a + b), mode = 0; while (roll > w[mode]) roll -= w[mode++];
      const a = pick(0, 2); let b = pick(0, 2); if (b === a) b = (a + 1 + pick(0, 1)) % 3;
      const ph = r() * 6, freq = 0.6 + 0.9 * cfg.d, count = pick(4, 5 + Math.round(cfg.d * 2));
      let x = lanes[a];
      for (let q = 0; q < count && sCur < cEnd - 2; q++) {
        if (mode === 3) { add(sCur, lanes[a], type); add(sCur, lanes[b], type); maxGet++; sCur += gap; continue; }
        if (mode === 4) {           // scattered: hop to a new spot each time, sometimes right up by the walls
          const jump = (0.4 + r() * 0.6) * (r() < 0.5 ? -1 : 1) * W * (0.5 + 0.5 * cfg.d);
          x = clamp(x + jump, -edge, edge); if (Math.abs(x) < 0.3) x = edge * Math.sign(jump || 1);
          add(sCur, x, type); maxGet++; sCur += Math.max(gap, reach * Math.abs(jump) / (W * 1.1)); continue;
        }
        x = mode === 0 ? lanes[a] : mode === 1 ? Math.sin(ph + q * freq) * edge : (q < count / 2 ? lanes[a] : lanes[b]);
        if (mode === 2 && q === Math.ceil(count / 2)) sCur += reach * 0.5;
        add(sCur, x, type); maxGet++; sCur += gap;
      }
      sCur += Math.max(4, reach * (0.7 - 0.3 * cfg.d));
    }
  }
  // one golden star per level, worth 3, in a risky spot near a wall
  { const c = 1 + pick(0, Math.max(0, cfg.chunks - 4)), sg = c * CH + 15, xg = (r() < 0.5 ? -1 : 1) * W * 0.68; out.push({ s: sg, x: xg, type: 'gold' }); busy.push([sg, xg]); maxGet += 3; }
  // grumpy snow blocks: more of them, and closer to the treats, as levels go up

const S = [];
function ensure(n) {
  while (S.length <= n) {
    const i = S.length; let x = 0, z = 0;
    if (i > 0) { const p = S[i - 1], yaw = yawE(i - 0.5); x = p.x + Math.sin(yaw); z = p.z - Math.cos(yaw); }
    S.push({ x, z, y: K * z + BASE + bumpE(i), f: null });
  }
}
const UP = new THREE.Vector3(0, 1, 0);
function frame(i) {
  ensure(i + 1);
  const s = S[i]; if (s.f) return s.f;
  const a = S[Math.max(0, i - 1)], b = S[i + 1];
  const T = new THREE.Vector3(b.x - a.x, b.y - a.y, b.z - a.z).normalize();
  const Rh = new THREE.Vector3().crossVectors(T, UP).normalize();
  const U0 = new THREE.Vector3().crossVectors(Rh, T);
  const bank = clamp(-(yawE(i + 0.5) - yawE(i - 0.5)) * 9, -0.18, 0.18);
  const R = Rh.clone().multiplyScalar(Math.cos(bank)).addScaledVector(U0, Math.sin(bank));
  const U = new THREE.Vector3().crossVectors(R, T);
  s.f = { P: new THREE.Vector3(s.x, s.y, s.z), T, R, U, Rh };
  return s.f;
}

}

function chocFill(y0, H) {

}
function drawCover(dt) {

function updateSanta(dt) {
  const s = santa;
  if (s.t < 0) {
    s.next -= dt;
    if (s.next <= 0 && phase === 'ride' && dist < END - 40) { s.t = 0; s.side = Math.random() < 0.5 ? 1 : -1; s.g.visible = true; sfxSanta(); }

  }
  s.t += dt; const D = 10, u = s.t / D;
  if (u >= 1) { s.t = -1; s.g.visible = false; s.next = 999; return; }
  _right.set(-camFwd.z, 0, camFwd.x);
  const along = (u - 0.5) * 150 * s.side;
  s.g.position.copy(eye).addScaledVector(camFwd, 85).addScaledVector(_right, along);
  s.g.position.y = eye.y + 14 + Math.sin(u * Math.PI) * 8 + Math.sin(s.t * 2) * 1.2;
  s.g.rotation.set(0, Math.atan2(-_right.z * s.side, _right.x * s.side), Math.sin(s.t * 2) * 0.05 + 0.08);
  for (const d of s.deer) d.userData.legs.forEach((l, i) => { l.rotation.z = Math.sin(s.t * 9 + i * 1.7) * 0.7; });

function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  // keep it smooth on slower tablets: drop resolution, then the glow, if frames are slow
  if (perf.t >= 0 && perf.level < 2) {
    perf.t += dt; if (perf.t > 2) { perf.n++; perf.sum += now - perf.lastNow; }
    perf.lastNow = now;

      const avg = perf.sum / perf.n;
      if (avg > 26) { perf.level++; if (perf.level === 1) { pixelRatio = 1; renderer.setPixelRatio(1); resize(); } else useComposer = false; }
      else perf.level = 2;
      perf.t = 0; perf.n = 0; perf.sum = 0;
    }
  }
  // steering

  if (keys.ArrowRight || keys.d) { targetX = Math.min(MAXX, targetX + 9 * dt); touched = true; }
  if (!playing) targetX = Math.sin(time * 0.6) * W * 0.45;
  const prevX = playerX;
  playerX += (targetX - playerX) * Math.min(1, dt * (playing ? 7 : 4));
  playerV = (playerX - prevX) / Math.max(dt, 1e-4);
  speed += (SPEED * (1 + 0.18 * clamp(dist / END, 0, 1)) - speed) * Math.min(1, dt * 0.8);
  if (phase === 'ride') dist += speed * dt;

  // keep chunks around us

  for (let c = Math.max(0, cNow - 1); c <= Math.min(cNow + AHEAD, RIDE_CHUNKS - 1); c++) if (!chunks.has(c)) { buildChunk(c); break; }
  for (const c of [...chunks.keys()]) if (c < cNow - 1) dropChunk(c);

  if (phase === 'ride' && dist >= END) {
    // off the end of the slide and into the cocoa lake
    phase = 'fly'; phaseT = 0; dist = END;
    flyPos.copy(eye); flyVel.copy(camF.T).multiplyScalar(speed); flyVel.y = Math.max(flyVel.y, 0) + 2.5;
    flyR.set(-lake.fz, 0, lake.fx);

  if (phase === 'ride') {
    frameAt(dist, camF);
    const lift = EYE + Math.sin(time * 9) * 0.015;
    eye.copy(camF.P).addScaledVector(camF.R, playerX).addScaledVector(camF.U, hProf(playerX) + lift);
    frameAt(dist + 15, lookF);
    look.copy(lookF.P).addScaledVector(lookF.R, playerX * 0.6).addScaledVector(lookF.U, 0.6);
    camera.up.copy(camF.U);

    phaseT += dt;
    flyPos.addScaledVector(flyVel, dt).addScaledVector(flyR, playerX - prevX);

    } else {
      const k = Math.exp(-dt * 3); flyVel.x *= k; flyVel.z *= k; flyVel.y *= k;
      flyPos.y = Math.max(lake.y + 0.35, flyPos.y);
      if (!playing && phaseT > 2.5) newRide(null);
    }
    if (phase !== 'ride') {
      eye.copy(flyPos);
      camF.T.set(lake.fx, 0, lake.fz); camF.U.set(0, 1, 0); camF.R.copy(flyR);
      look.copy(eye).addScaledVector(camF.T, 14); look.y -= phase === 'fly' ? 2.6 : 1.5;

  camera.rotateZ(-playerV * 0.01);
  if (shake > 0) { shake = Math.max(0, shake - dt); camera.position.x += (Math.random() - 0.5) * shake * 0.6; camera.position.y += (Math.random() - 0.5) * shake * 0.6; rig.position.x = (Math.random() - 0.5) * shake * 0.08; } else rig.position.x = 0;
  camFwd.set(camF.T.x, 0, camF.T.z).normalize();

  warm2.position.copy(eye).addScaledVector(camF.T, 26).addScaledVector(camF.U, 4);
  sky.position.copy(eye);
  ground.position.set(Math.round(eye.x / 30) * 30, 0, Math.round(eye.z / 30) * 30); ground.position.y = K * ground.position.z;

  for (const h of floaters) {
    const u = h.userData, p = time * 1.6 + u.phase;
    u.g.position.y = Math.sin(p) * 0.12 + (u.kind < 3 ? 0.05 : -0.5); u.g.rotation.z = Math.sin(p * 0.8) * 0.06; u.g.rotation.x = Math.cos(p * 0.7) * 0.05;

window.cocoaDebug = { scene, get dist() { return dist; }, set dist(v) { dist = v; }, get score() { return score; }, get x() { return playerX; }, get phase() { return phase; }, set phaseT(v) { phaseT = v; }, get END() { return END; }, get plan() { return plan; }, get best() { return best; }, get rideScore() { return rideScore; }, planFor(L) { const c = levelCfg(L); return { cfg: c, plan: planItems(c), CH }; }, levels() { return Array.from({ length: LEVELS }, (_, i) => { const c = levelCfg(i + 1), p = planItems(c); return [i + 1, c.chunks * CH / c.speed | 0, p.items.length, p.maxGet, p.goals.join("/"), c.magnet.toFixed(1)]; }); }, santa(t) { if (t) { santa.t = t; santa.g.visible = true; } else santa.next = 0; } };
