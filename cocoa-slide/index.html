<style>
/* One look on purpose: a cozy night ride. Chocolate, cream and twinkle-light gold over a deep winter sky. */
:root {
  --night: #0b1030; --cocoa: #4a2412; --cocoa-2: #2a1208; --cream: #fff6e6; --gold: #ffc94a; --berry: #e0344b;

  background: rgba(42, 18, 8, .62); border: 3px solid rgba(255, 228, 184, .55); pointer-events: none;

  width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255, 228, 184, .4); background: rgba(42, 18, 8, .45);

const mugTex = canvasTex(512, 256, (g, w, h) => {

const bootTex = canvasTex(128, 128, (g, w, h) => {

  const r = rng(5);

    eye.copy(camF.P).addScaledVector(camF.R, playerX).addScaledVector(camF.U, hProf(playerX) + lift);
    frameAt(dist + 11, lookF);
    look.copy(lookF.P).addScaledVector(lookF.R, playerX * 0.6).addScaledVector(lookF.U, 0.5);
    camera.up.copy(camF.U);
  } else {
    phaseT += dt;
    flyPos.addScaledVector(flyVel, dt).addScaledVector(flyR, playerX - prevX);
    if (phase === 'fly') {
      flyVel.y -= 13 * dt;
      if (flyPos.y <= lake.y + 1.0 && flyVel.y < 0) {
        phase = 'float'; phaseT = 0; flyVel.y = 0; flyPos.y = lake.y + 1.0;
        startSplash(); sfxSplash(); mug.userData.bump = 1;
        sparks.burst(flyPos.clone().addScaledVector(_v.set(lake.fx, 0, lake.fz), 2.5).setY(lake.y + 0.4), 90, ['#c8793a', '#fff1d6', '#a0562a', '#ffd9a8'], 5);
        if (started) setTimeout(() => { yayEl.classList.remove('go'); void yayEl.offsetWidth; yayEl.classList.add('go'); sfxFanfare(); }, 350);
      }
    } else {
      const k = Math.exp(-dt * 0.75); flyVel.x *= k; flyVel.z *= k;
      flyPos.y = lake.y + 1.0 + Math.sin(phaseT * 2.2) * 0.07;
      if (phaseT > 5.5) fadeEl.classList.add('on');
      if (phaseT > 7.2) { newRide(false); fadeEl.classList.remove('on'); if (started) sfxWhee(); }
    }
    if (phase !== 'ride') {
      eye.copy(flyPos);
      camF.T.set(lake.fx, 0, lake.fz); camF.U.set(0, 1, 0); camF.R.copy(flyR);
      look.copy(eye).addScaledVector(camF.T, 12); look.y -= phase === 'fly' ? 2.2 : 1.4;
      camera.up.set(0, 1, 0);
    }
  }
  camera.position.copy(eye); camera.lookAt(look);
  camera.rotateZ(-playerV * 0.03);

  warm.position.copy(eye).addScaledVector(camF.T, 6).addScaledVector(camF.U, 1.5);
  sky.position.copy(eye);
  ground.position.set(Math.round(eye.x / 30) * 30, 0, Math.round(eye.z / 30) * 30); ground.position.y = K * ground.position.z;
  moonLight.target.position.copy(eye);

  // items: spin, magnet, grab
  for (const it of items) {
    const u = it.userData; if (u.taken) continue;
    const ds = u.s - dist;
    it.visible = ds > -3 && ds < 85;
    if (!it.visible) continue;
    if (ds < 7 && Math.abs(u.x - playerX) < 1.8) { u.x += (playerX - u.x) * Math.min(1, dt * 3); }
    if (ds < 30) placeOnTrack(u.s, u.x, 0.75 + Math.sin(time * 3 + u.spin) * 0.12, it.position);
    it.rotation.y = time * 2 + u.spin;
    if (started && Math.abs(ds) < 1.2 && Math.abs(u.x - playerX) < 1.0) collect(it);
  }
  for (const g of friends) { const [l, r] = g.userData.arms, p = time * 7 + g.userData.phase; r.rotation.z = 2.3 + Math.sin(p) * 0.5; l.rotation.z = -0.4 - Math.sin(p * 0.5) * 0.15; g.position.y += Math.sin(p * 2) * 0.003; }
  for (const h of floaters) {
    const u = h.userData, p = time * 1.6 + u.phase;
    u.g.position.y = Math.sin(p) * 0.12 - (u.kind < 3 ? 0.25 : 0.1); u.g.rotation.z = Math.sin(p * 0.8) * 0.08; u.g.rotation.x = Math.cos(p * 0.7) * 0.06;
    u.ring.scale.setScalar(0.8 + ((time * 0.5 + u.phase) % 1) * 1.4); u.ring.position.y = 0.03;
  }
  updateSplash(dt);
  sparks.update(dt);
  updateSnow(dt, time, camera.position);
  if (wind) wind.gain.value = 0.035 + Math.abs(playerV) * 0.01;

  // the rider
  legs.rotation.z = clamp(-playerV * 0.035, -0.12, 0.12);
  legs.position.y = Math.sin(time * 9) * 0.006;
  const b = (mug.userData.bump || 0); mug.userData.bump = Math.max(0, b - dt * 4);
  mugBody.scale.setScalar(1 + Math.sin(b * Math.PI) * 0.12);
  mugBody.position.y = Math.sin(time * 3.1) * 0.012;
  rig.rotation.z = clamp(-playerV * 0.01, -0.05, 0.05);
  fgGlow.intensity = 2.6 + Math.sin(dist / 1.25 * Math.PI * 2) * 0.4;
  mug.getWorldPosition(mugTarget); mugTarget.y += 0.13;
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i]; f.t += dt * 1.7; const t = Math.min(1, f.t), e = t * t * (3 - 2 * t);
    f.g.position.lerpVectors(f.start, mugTarget, e); f.g.position.y += Math.sin(t * Math.PI) * 0.35;
    f.g.scale.setScalar(0.3 * (1 - t * 0.6) * MUG_SCALE * 2); f.g.rotation.y += dt * 8;
    if (t >= 1) { fgScene.remove(f.g); flyers.splice(i, 1); addPoint(); }
  }

  renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();
  renderer.render(fgScene, fgCam);
  requestAnimationFrame(tick);
}
window.cocoaDebug = { get dist() { return dist; }, set dist(v) { dist = v; }, get score() { return score; }, get items() { return items.map(i => [+i.userData.s.toFixed(1), +i.userData.x.toFixed(2), i.userData.taken]); }, get x() { return playerX; }, get phase() { return phase; }, set phaseT(v) { phaseT = v; }, END };
// warm up the first stretch before the first frame
newRide(true);
requestAnimationFrame(tick);
</script>
